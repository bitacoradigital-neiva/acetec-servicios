<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACETEC</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#020C22">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ACETEC">
<script src="config.js"></script>
<style>
:root{color-scheme:light;--navy:#020C22;--navy-2:#0A1A3F;--p:#024CAF;--p-d:#013A87;--p-l:#1281CF;--r:#CC1204;--r-d:#A40102;--gold:#EBBA0B;--ice:#EAF1FB;--steel:#53627B;--bg:#F3F6FB;--tx:#0E1A33;--bd:#DCE3EE;--wa:#0B7A08;--wa-d:#086305;--warn:#A40102;--amber:#8A5000;--sh1:0 1px 2px rgba(2,12,34,.06),0 1px 3px rgba(2,12,34,.04);--sh2:0 10px 30px rgba(2,40,100,.14),0 2px 6px rgba(2,12,34,.06);--rl:16px;--rm:12px;--rs:10px;
 --f:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fc:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--f);font-size:16px;line-height:1.45;background:var(--bg);color:var(--tx)}
.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
h1,h2,h3{font-family:var(--fc);letter-spacing:.01em;line-height:1.1;color:var(--navy)}
h2{font-size:28px;font-weight:700}h3{font-size:22px}
header{position:relative;background:var(--navy);color:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--p) 0 62%,var(--r) 62% 100%)}
header h1{font-size:24px;margin:0;flex:1;color:#fff;font-weight:700;letter-spacing:.04em}
header h1 span{font-family:var(--f);font-size:13px!important;font-weight:500!important;letter-spacing:0;color:#B9C6E4}
header select{width:auto;max-width:190px;padding:7px 10px;border-radius:999px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font-size:14px!important}
header select option{color:var(--tx)}
header .muted{display:none}
nav{display:flex;background:#fff;border-bottom:1px solid var(--bd);overflow-x:auto;position:sticky;top:0;z-index:5}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border:0;background:none;font:500 15px var(--f);color:var(--steel);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;transition:color .2s,border-color .2s}
nav button .i{width:20px;height:20px}
nav button.on{color:var(--p);border-color:var(--p);font-weight:600}
#sync{display:flex;align-items:center;gap:7px;background:#fff;border-bottom:1px solid var(--bd);padding:7px 16px!important;font-size:13.5px!important}
#sync.spin .i{animation:rot 1s linear infinite}
main{max-width:860px;margin:0 auto;padding:18px 14px 40px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.card b{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--steel);margin:14px 0 6px}
input,textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;font-size:16px!important;background:#fff;color:var(--tx);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px #1E5BD826}
input::placeholder,textarea::placeholder{color:#9AA4B6}
textarea{min-height:84px;resize:vertical}
input[type=file]{padding:9px;background:var(--ice);border-style:dashed}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font:600 15px var(--f);cursor:pointer;text-decoration:none;color:var(--tx);transition:transform .12s var(--ease),background .15s,border-color .15s;touch-action:manipulation}
.btn:hover{border-color:#B8C3D6}
.btn:active{transform:scale(.96)}
.btn:focus-visible,nav button:focus-visible{outline:3px solid #1E5BD866;outline-offset:2px}
.btn.pr{background:var(--p);color:#fff;border-color:var(--p)}.btn.pr:hover{background:var(--p-d)}
.btn.wa{background:var(--wa);color:#fff;border-color:var(--wa)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.dg{color:var(--warn);border-color:#F1C9C5}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--ice);color:var(--p);font-weight:600;vertical-align:2px}
.tag .i{width:12px;height:12px}
.tag.pend{background:#FFF2DC;color:var(--amber)}.tag.done{background:#E3F6EA;color:#17803F}.tag.rep{background:#FDE7E5;color:var(--warn)}
.muted{color:var(--steel);font-size:14px}
.muted .i{color:#8794AB}
.num{width:36px;height:36px;border-radius:50%;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:center;font:700 19px var(--fc);flex:none;box-shadow:0 0 0 4px var(--bg)}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photos img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
/* ruta del día: línea de recorrido */
.route{position:relative;padding-left:52px}
.route::before{content:"";position:absolute;left:17px;top:24px;bottom:22px;border-left:3px dashed #F0A49C}
.route .card.stop{position:relative}
.route .card.stop .num{position:absolute;left:-53px;top:14px}
.route-end{position:relative;display:flex;align-items:center;gap:8px;color:var(--steel);font:600 15px var(--fc);letter-spacing:.03em;margin-left:-52px;padding:2px 0 0}
.route-end .i{width:36px;height:22px;color:var(--r)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.day{min-width:72px;text-align:center;padding:10px 6px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;cursor:pointer;scroll-snap-align:start;transition:border-color .15s,background .15s}
.day.on{border-color:var(--p);background:var(--ice)}.day b{display:block;font:700 24px var(--fc);color:var(--navy)}.day small{font-size:12px;color:var(--steel);text-transform:capitalize}
.full{color:var(--warn)!important;font-weight:600}
.modal{position:absolute;top:0;left:0;right:0;min-height:100%;background:rgba(15,30,69,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 10px;z-index:9}
.modal.on{display:flex;animation:fade .2s ease both}
.modal .card{max-width:560px;width:100%;border:0;box-shadow:0 18px 50px rgba(15,30,69,.28);animation:up .3s var(--ease) both}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;max-width:300px;margin:0 auto;border:1px dashed #9AA4B6;padding:12px;background:#fff}
.receipt h3{text-align:center;margin:4px 0;font-family:var(--fc)}.receipt hr{border:0;border-top:1px dashed #9AA4B6}
.banner{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:10px;padding:11px 13px;font-size:14px;margin-bottom:16px;color:var(--steel)}
.banner .i{color:var(--p);margin-top:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:99;font-size:15px;box-shadow:0 10px 30px rgba(15,30,69,.3);animation:toast .3s var(--ease) both;display:flex;gap:8px;align-items:center;max-width:92vw}
.toast.out{opacity:0;transform:translate(-50%,8px);transition:.3s}

@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rot{to{transform:rotate(360deg)}}
/* celular: menú abajo, al alcance del pulgar */
@media (max-width:700px){
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;border:0;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);overflow:visible;box-shadow:0 -6px 20px rgba(15,30,69,.06)}
 nav button{flex-direction:column;gap:3px;padding:8px 2px 9px;font-size:11.5px;border-bottom:0;border-top:3px solid transparent;min-width:0}
 nav button.on{border-top-color:var(--p);background:linear-gradient(var(--ice),#fff)}
 main{padding-bottom:96px}
 .toast{bottom:88px}
 h2{font-size:25px}
 .route{padding-left:46px}.route .card.stop .num{left:-47px}.route::before{left:15px}.route-end{margin-left:-46px}
}

.alerta{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:18px;border-top:4px solid var(--amber)}
.alerta.alto{border-top-color:var(--r)}.alerta.bajo{border-top-color:var(--p)}
.alerta-t{display:flex;align-items:center;gap:6px;font:600 13px var(--f);color:var(--steel);margin-bottom:10px}
.alerta-t .i{width:15px;height:15px}
.dias.hoy{font-size:17px}
.alerta-h{display:flex;gap:10px;align-items:flex-start}
.alerta-h>.i{width:24px;height:24px;color:var(--amber);margin-top:2px}
.alerta.alto .alerta-h>.i{color:var(--r)}
.alerta.bajo .alerta-h>.i{color:var(--p)}
.espera{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.espera li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--bg)}
.espera li .grow{flex:1 1 170px}
@media (max-width:520px){.espera li{flex-wrap:wrap}.espera li .btn{margin-left:58px}.espera li .btn+.btn{margin-left:0}}
.dias{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:10px;font:700 22px/1 var(--fc);color:#fff;background:var(--p)}
.dias small{font:500 11px var(--f);opacity:.9}
.espera li.medio .dias{background:var(--amber)}.espera li.alto .dias{background:var(--r)}
.tag.edad.bajo{background:var(--ice);color:var(--p)}.tag.edad.medio{background:#FFF2DC;color:var(--amber)}.tag.edad.alto{background:#FDE7E5;color:var(--warn)}
nav button{position:relative}
.badge{position:absolute;top:6px;right:calc(50% - 30px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--r);color:#fff;font:700 11px/18px var(--f);font-style:normal;text-align:center;box-shadow:0 0 0 2px #fff}
@media (min-width:701px){.badge{top:8px;right:auto;margin-left:4px;position:static}}
.ubic-check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px;border:1.5px solid #CFE0FB;background:var(--ice);border-radius:12px;color:var(--tx);cursor:pointer}
.ubic-check input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--p)}
.ubic-check span{display:flex;flex-direction:column;gap:3px;font-size:15px}
.ubic-check span .i{color:var(--p);display:none}
.ubic-check small{color:var(--steel);font-size:13px;font-weight:400}
.card.hecho [onclick^="comoLlegar"],.card.hecho [onclick^="guardarUbicAqui"],.card.hecho [onclick^="marcarCamino"],.card.hecho [onclick^="mover"]{display:none}
.card.hecho{background:#FAFCFB;border-color:#CDEBD7}.card.hecho .num{background:var(--wa)}
.tag.abierto{background:#FFF2DC;color:var(--amber)}
.candado{width:52px;height:52px;border-radius:50%;background:#FFF2DC;color:var(--amber);display:flex;align-items:center;justify-content:center}.candado .i{width:26px;height:26px}
.tel-grande{font:700 32px var(--fc);letter-spacing:.04em;color:var(--navy);margin:2px 0}
.tag.camino{background:#E3F6EA;color:#17803F}
.hechos{background:#fff;border:1px solid #BFE6CC;border-top:4px solid var(--wa);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.hechos-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.hechos-h b{flex:1;min-width:160px}
.hechos-h>.i{width:24px;height:24px;color:var(--wa)}
.hechos ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.hechos li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:10px;background:#F1FAF4}
.hechos li .grow{flex:1 1 200px}

/* ===== Capa visual modernizada (marca ACETEC) ===== */
body{font-size:15.5px;-webkit-font-smoothing:antialiased}
h2{font-size:26px}h3{font-size:21px}
header{background:var(--navy);padding:12px 18px 15px;gap:14px}
header::after{height:3px;background:linear-gradient(90deg,var(--p) 0 50%,var(--r) 50% 100%)}
header img{box-shadow:0 0 0 2px rgba(255,255,255,.9)!important;border:0!important}
header h1{font-size:23px;letter-spacing:.06em}
header h1 span{color:#AFC0E2;letter-spacing:.01em}
header select,header .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff;min-height:38px}
header .btn:hover{background:rgba(255,255,255,.16)}
nav{box-shadow:var(--sh1)}
nav button{font-weight:500}
nav button.on{color:var(--p)}
nav button:hover:not(.on){color:var(--tx)}
#sync{color:var(--steel)}
main{padding:20px 16px 48px}
.card{border-color:var(--bd);border-radius:var(--rl);box-shadow:var(--sh1);padding:18px}
label{font-size:13.5px;font-weight:600;color:var(--steel);margin:14px 0 6px}
input,textarea,select{border-radius:var(--rs);border-color:var(--bd);background:#fff;min-height:46px}
input:hover,textarea:hover,select:hover{border-color:#BFCBDD}
input:focus,textarea:focus,select:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(2,76,175,.14)}
input::placeholder,textarea::placeholder{color:#66748A}
input[type=file]{background:var(--ice);border:1.5px dashed #AFC3E3;color:var(--steel)}
.btn{border-radius:var(--rs);min-height:42px;padding:9px 16px;font-weight:600;border-color:var(--bd);transition:transform .12s var(--ease),background-color .15s,border-color .15s,box-shadow .15s,color .15s}
.btn:hover{border-color:#B6C3D8;background:#F8FAFD}
.btn.pr{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 1px 2px rgba(2,76,175,.25)}
.btn.pr:hover{background:var(--p-d);border-color:var(--p-d)}
.btn.sec{background:var(--ice);border-color:#C9DAF3;color:var(--p)}
.btn.sec:hover{background:#DCE8FA;border-color:#AFC6EC}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}.btn.wa:hover{background:var(--wa-d)}
.btn.dg{color:var(--r-d);border-color:#F0C4C0;background:#fff}.btn.dg:hover{background:#FDF1F0}
.btn:focus-visible,a:focus-visible,nav button:focus-visible,.day:focus-visible{outline:3px solid rgba(2,76,175,.45);outline-offset:2px}
.tag{font-size:12px;padding:3px 10px;font-weight:600;letter-spacing:.01em}
.tag.pend{background:#FFF1D6;color:var(--amber)}.tag.done{background:#E2F3E1;color:var(--wa-d)}.tag.rep{background:#FCE6E4;color:var(--r-d)}
.tag.exacta{background:var(--ice);color:var(--p)}
.tag.camino{background:#E2F3E1;color:var(--wa-d)}.tag.abierto{background:#FFF1D6;color:var(--amber)}
.muted{color:var(--steel)}
/* tarjeta de servicio */
.svc{padding:16px 16px 14px}
.svc-top{align-items:flex-start;flex-wrap:nowrap}
.svc-nombre{font:700 21px/1.15 var(--fc);color:var(--navy);letter-spacing:.01em}
.svc-tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.svc-tags:empty{display:none}
.svc-dir{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.svc-equipo{margin:12px 0 8px;padding:10px 12px;background:var(--bg);border-radius:var(--rs);display:flex;flex-direction:column;gap:2px}
.svc-equipo b{font-weight:600;color:var(--tx)}.svc-equipo span{color:var(--steel);font-size:14.5px}
.svc-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px}.svc-meta span{display:inline-flex;align-items:center;gap:5px}
.svc-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.svc-acc .btn{justify-content:center;min-height:46px}
.svc-acc .btn:only-child{grid-column:1/-1}
.svc-tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px solid var(--bd)}
.btn.tool{min-height:38px;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--steel);background:#fff;border-color:transparent}
.btn.tool:hover{background:var(--bg);color:var(--tx);border-color:var(--bd)}
.btn.tool .i{width:17px;height:17px}
.btn.tool.llamar{color:var(--p)}
.btn.tool.wa-t{color:var(--wa-d)}
.btn.tool.icono{padding:6px 10px;margin-left:auto}
.orden{display:flex;gap:2px}.orden .btn.tool.icono{margin:0;border-color:var(--bd)}
.card.hecho{background:#FBFDFB;border-color:#CFE8CE}.card.hecho .num{background:var(--wa)}
.card.hecho .svc-tools .wa-t,.card.hecho .svc-tools [onclick^="guardarUbicAqui"]{display:none}
/* ruta */
.route::before{border-left:2px dashed #E7A39C}
.num{background:var(--r);box-shadow:0 0 0 4px var(--bg),0 2px 6px rgba(204,18,4,.3)}
.route-end .i{color:var(--r)}
/* avisos unificados */
.alerta,.hechos{border-radius:var(--rl);border:1px solid var(--bd);border-top-width:1px;border-left:5px solid var(--amber);box-shadow:var(--sh1);padding:16px 18px}
.alerta.alto{border-left-color:var(--r)}.alerta.bajo{border-left-color:var(--p)}.hechos{border-left-color:var(--wa)}
.alerta-t{color:var(--steel)}
.espera li,.hechos li{background:var(--bg);border-radius:var(--rm);padding:10px 12px}
.hechos li{background:#F1F8F0}
.dias{border-radius:var(--rs);background:var(--p)}
.espera li.medio .dias{background:var(--amber)}.espera li.alto .dias{background:var(--r)}
.banner{border-radius:var(--rm);border-left-color:var(--p);box-shadow:none;background:#fff;padding:10px 14px}
/* agenda */
.day{border-radius:var(--rm);padding:10px 6px 8px;min-width:76px;box-shadow:var(--sh1);border-color:transparent}
.day:hover{border-color:#C9DAF3}
.day.on{background:var(--p);border-color:var(--p)}.day.on b,.day.on small{color:#fff}
.day small:last-child{text-transform:none}
.ocup{display:block;height:4px;border-radius:2px;background:#E3E9F3;margin:6px 8px 4px;overflow:hidden}
.ocup i{display:block;height:100%;background:var(--p-l);border-radius:2px;transition:width .3s var(--ease)}
.ocup.llena i{background:var(--r)}.day.on .ocup{background:rgba(255,255,255,.3)}.day.on .ocup i{background:#fff}
/* estados vacíos */
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:34px 20px;border:1.5px dashed var(--bd);border-radius:var(--rl);color:var(--steel);background:#fff}
.vacio .i{width:34px;height:34px;color:#7D93BA;margin-bottom:6px}.vacio b{color:var(--tx);font-size:16.5px}
/* formulario */
.seccion{display:flex;align-items:center;gap:8px;margin:26px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--bd);font:700 17px var(--fc);letter-spacing:.03em;color:var(--navy)}
.seccion .i{color:var(--p)}
.pegar{background:var(--ice);border:1px solid #CFDEF5;border-radius:var(--rm);padding:14px;margin:4px 0 6px}
.pegar textarea{background:#fff;margin-bottom:10px}
.form-acc{position:sticky;bottom:0;margin:22px -18px -18px;padding:12px 18px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--bd);border-radius:0 0 var(--rl) var(--rl);z-index:3}
.form-acc .btn.pr{flex:1;justify-content:center;min-height:48px;font-size:16px}
/* ventanas */
.modal{background:rgba(2,12,34,.55)}
.modal .card{border-radius:20px;box-shadow:var(--sh2);padding:22px}
.recibo-acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;max-width:520px;margin-left:auto;margin-right:auto}
.recibo-acc>div{grid-column:1/-1}
.recibo-acc>.btn{justify-content:center}
.recibo-acc>.btn.wa:first-of-type{grid-column:1/-1;min-height:50px;font-size:16px}
.receipt{border-radius:var(--rs);border-color:#B8C4D8;box-shadow:var(--sh1)}
.candado{background:#FFF1D6;color:var(--amber)}
.toast{background:var(--navy);border-radius:var(--rm);box-shadow:var(--sh2)}
/* celular */
@media (max-width:700px){
 nav{box-shadow:0 -4px 18px rgba(2,12,34,.08)}
 nav button.on{background:linear-gradient(#EAF1FB,#fff)}
 .btn{min-height:44px}.btn.tool{min-height:40px}
 .svc-acc .btn{min-height:48px;padding:8px 10px;font-size:15px;gap:6px}
 .svc-acc .btn,.btn.tool{white-space:nowrap}
 .route{padding-left:40px}.route .card.stop .num{left:-41px;width:32px;height:32px;font-size:17px}.route::before{left:14px}.route-end{margin-left:-40px}
 .svc{padding:14px 14px 12px}.svc-nombre{font-size:20px}
 .form-acc{bottom:64px;margin:22px -16px -16px;border-radius:0}
 header h1 span{display:none}
 .recibo-acc{grid-template-columns:1fr}
}
/* ajustes v2: liviano */
.svc-dir{display:block}.svc-dir .i{margin-right:4px}.svc-dir .tag{margin-left:2px}
input[type=file]::file-selector-button{font:600 14px var(--f);color:var(--p);background:#fff;border:1.5px solid #C9DAF3;border-radius:8px;padding:7px 12px;margin-right:10px;cursor:pointer}
@media (max-width:700px){
 header{flex-wrap:nowrap;padding:10px 14px 13px;gap:10px}
 header img{width:38px!important;height:38px!important}
 header h1{font-size:21px;min-width:0}
 header select{max-width:132px;min-height:36px;padding:6px 8px;font-size:13.5px!important}
 header .btn.sm{min-height:36px;padding:6px 10px;font-size:13.5px}
 #sync{padding:6px 14px!important;font-size:12.5px!important}
}
@media (max-width:520px){
 .espera li{display:grid;grid-template-columns:48px 1fr auto;column-gap:10px;row-gap:8px;align-items:start}
 .espera li .grow{grid-column:2;grid-row:1}
 .espera li .btn{margin:0!important}
 .espera li .btn:last-child{grid-column:3;grid-row:1}
 .espera li .btn:not(:last-child){grid-column:2;grid-row:2;justify-self:start}
}
/* ===== Diseño ACETEC v3: frío + calor ===== */
:root{--bg:#EEF2F8;--bd:#D9E1EE;--cinta:linear-gradient(104deg,var(--p) 0 56%,var(--r) 56% 100%);--sh1:0 1px 2px rgba(2,12,34,.05),0 2px 8px rgba(2,12,34,.05);--sh2:0 14px 40px rgba(2,12,34,.18),0 2px 6px rgba(2,12,34,.06)}
body{background:var(--bg)}
/* títulos con la cinta del logo */
main>h2,main>.row>h2,main .card>h2:first-child{font-size:30px;letter-spacing:.005em;position:relative;padding-bottom:10px}
main>h2::after,main>.row>h2::after,main .card>h2:first-child::after{content:"";position:absolute;left:2px;bottom:0;width:44px;height:5px;background:var(--cinta);transform:skewX(-20deg);border-radius:1px}
/* encabezado */
header{background:radial-gradient(90% 140% at 0% 0%,#0B2556 0%,var(--navy) 55%)}
header::after{height:4px;background:var(--cinta)}
header h1{font-size:25px;letter-spacing:.07em}
header img{box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(18,129,207,.35)!important}
/* menú escritorio: parte del encabezado */
@media (min-width:701px){
 nav{background:var(--navy);border:0;box-shadow:0 6px 18px rgba(2,12,34,.12);justify-content:center;gap:4px;padding:0 12px}
 nav button{flex:0 1 auto;color:#AFC0E2;padding:13px 18px 12px;border-bottom:0;position:relative}
 nav button:hover:not(.on){color:#fff}
 nav button.on{color:#fff}
 nav button.on::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:4px;background:var(--gold);transform:skewX(-20deg)}
 .badge{box-shadow:0 0 0 2px var(--navy)}
}
#sync{background:#F7F9FC!important;font-weight:600}
/* tarjetas: jerarquía de esquinas */
.card{border-radius:18px;border-color:var(--bd)}
.btn{border-radius:12px}
.tag{border-radius:6px;padding:3px 8px}
.btn.pr{background:linear-gradient(180deg,#0659C4,var(--p));box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 6px rgba(2,76,175,.28)}
.btn.pr:hover{background:var(--p-d)}
.btn.wa{box-shadow:0 2px 6px rgba(11,122,8,.25)}
/* tarjeta de servicio = orden de trabajo */
.svc-nombre{font-size:24px}
.svc-equipo{background:#F4F7FC;border-left:4px solid var(--p-l);border-radius:4px 12px 12px 4px;padding:10px 14px}
.svc-equipo b{font:700 17px/1.2 var(--fc);letter-spacing:.01em;color:var(--navy)}
.svc-acc .btn{border-radius:12px}
.svc-tools{border-top:1px dashed var(--bd)}
/* ruta: carretera continua */
.route::before{border-left:0;width:4px;left:16px;background:repeating-linear-gradient(180deg,#C9D4E6 0 14px,transparent 14px 22px);border-radius:2px}
.num{font-size:20px;box-shadow:0 0 0 5px var(--bg),0 4px 10px rgba(204,18,4,.32)}
.card.hecho .num{box-shadow:0 0 0 5px var(--bg)}
.route-end{color:var(--navy)}
/* avisos */
.alerta,.hechos{border-radius:18px;border-left-width:6px}
.alerta-t{font-size:13px}
.dias{border-radius:12px;font-size:24px}
.espera li,.hechos li{border-radius:12px}
.banner{border-radius:12px;border-left-width:5px;background:#fff}
/* agenda */
.day{border-radius:14px;background:#fff}
.day b{font-size:28px;line-height:1.05}
.day.on{background:var(--navy);border-color:var(--navy);box-shadow:0 6px 16px rgba(2,12,34,.25)}
.day.on .ocup i{background:var(--gold)}
/* formulario */
.seccion{font-size:19px;border-bottom:0;padding-bottom:0;margin-top:30px}
.seccion .i{width:30px;height:30px;padding:6px;border-radius:9px;background:var(--ice)}
.pegar{border-radius:14px;border-style:dashed;border-color:#AFC6EC}
input,textarea,select{border-radius:12px}
/* ventanas y avisos flotantes */
.modal{backdrop-filter:blur(3px)}
.modal .card{border-radius:22px;border-top:5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--cinta) border-box}
.toast{border-left:4px solid var(--gold)}
/* inicio de sesión */
#login{background:radial-gradient(90% 60% at 20% 0%,#0B2556 0%,var(--navy) 60%)!important}
#login .card{border-radius:24px;border:0;border-top:6px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--cinta) border-box;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#login h2{font-size:32px;letter-spacing:.08em}
@media (max-width:700px){
 nav button.on{background:none;color:var(--p)}
 nav button.on .i{background:var(--ice);border-radius:10px;padding:3px 10px;width:42px;height:28px}
 nav button .i{padding:3px 10px;width:42px;height:28px}
 nav button.on{border-top-color:transparent}
 nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--cinta);transform:skewX(-20deg)}
 main>h2,main>.row>h2,main .card>h2:first-child{font-size:27px}
 .svc-nombre{font-size:22px}
 .card{border-radius:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const ic=n=>`<svg class="i i-${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;

const CUPO=6;
const DEF={cur:'u1',negocio:{nombre:'ACETEC',lema:'Venta de repuestos y reparación',tel:'3227477621',dir:''},
 users:[{id:'u1',nombre:'Jorge Náñez',rol:'Técnico (admin)'},{id:'u2',nombre:'Usuario 2',rol:'Técnico'}],
 servicios:[]};
let state;
let synced={},pend=new Set(),flushing=false,lastSync=null,dbState='cargando';
const vivos=()=>state.servicios.filter(s=>!s.borrado);
const firma=o=>JSON.stringify({...o,updatedAt:0});
const cfgDe=()=>({users:state.users,negocio:state.negocio});
function load(){try{state=JSON.parse(localStorage.getItem('st_app'));const m=JSON.parse(localStorage.getItem('st_sync')||'{}');synced=m.synced||{};pend=new Set(m.pend||[]);lastSync=m.lastSync||null}catch(e){}
 if(!state){state=JSON.parse(JSON.stringify(DEF))}
 if(state.negocio.nombre==='Servicio Técnico')state.negocio={...DEF.negocio,dir:state.negocio.dir}}
function persist(){try{localStorage.setItem('st_app',JSON.stringify(state));localStorage.setItem('st_sync',JSON.stringify({synced,pend:[...pend],lastSync}))}catch(e){toast('No se pudo guardar en el equipo (memoria llena)')}}
function save(){const now=Date.now();
 for(const x of state.servicios){const j=firma(x);if(synced[x.id]!==j){x.updatedAt=now;synced[x.id]=j;pend.add(x.id)}}
 const jc=JSON.stringify(cfgDe());if(synced.__cfg!==jc){state.cfgAt=now;synced.__cfg=jc;pend.add('__cfg')}
 persist();estado();flush()}
const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({message:'timeout'}),ms))]);
let api=null,codigo=null,lastPull=0;
try{codigo=JSON.parse(localStorage.getItem('st_cred')||'null');lastPull=Number(localStorage.getItem('st_pull2')||0)}catch(e){}
async function apiSheets(accion,datos){const r=await conTiempo(fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({correo:codigo&&codigo.correo,clave:codigo&&codigo.clave,accion},datos||{}))}).then(x=>x.json()),45000);
 if(!r||!r.ok){const e=new Error((r&&r.error)||'error');e.codigo=r&&r.error;
  if(e.codigo==='codigo'&&codigo){codigo=null;try{localStorage.removeItem('st_cred')}catch(_){};mostrarLogin()}throw e}return r}
async function flush(){if(!api||!codigo||flushing||!navigator.onLine||!pend.size)return;flushing=true;estado();let otraVez=false;
 try{const ids=[...pend].slice(0,8),antes={},filas=[];
  for(const id of ids){const esCfg=id==='__cfg';const body=esCfg?{...cfgDe(),updatedAt:state.cfgAt}:state.servicios.find(x=>x.id===id);
   if(!body){pend.delete(id);continue}
   antes[id]=esCfg?synced.__cfg:synced[id];
   filas.push(esCfg?{tabla:'config',id:'app',data:body,updated_at:body.updatedAt||0}:{tabla:'servicios',id,data:body,updated_at:body.updatedAt||0,borrado:!!body.borrado})}
  if(filas.length){let r;try{r=await apiSheets('subir',{filas})}catch(e){console.warn(e);dbState='error';return}
   for(const g of r.guardados||[]){
    if(g.tabla==='config'){if(synced.__cfg===antes.__cfg)pend.delete('__cfg');continue}
    const l=state.servicios.find(x=>x.id===g.id);if(!l){pend.delete(g.id);continue}
    if(synced[g.id]===antes[g.id]){if(g.fotos)l.fotos=g.fotos;if(g.fotosFin)l.fotosFin=g.fotosFin;synced[g.id]=firma(l);pend.delete(g.id)}}
   otraVez=pend.size>0}
  if(!pend.size){lastSync=Date.now();dbState='ok'}}
 finally{flushing=false;persist();estado()}
 if(pend.size&&navigator.onLine)setTimeout(flush,otraVez?500:15000)}
function repintar(){if(view!=='nuevo'&&!document.getElementById('modal').classList.contains('on'))render()}
function aplicarServicio(r){if(!r||!r.id)return false;const l=state.servicios.find(x=>x.id===r.id);
 if(pend.has(r.id)&&l&&(l.updatedAt||0)>=(r.updatedAt||0))return false;
 if(!l||(r.updatedAt||0)>(l.updatedAt||0)){revisarCierre(l,r);const c=JSON.parse(JSON.stringify(r));if(l){Object.keys(l).forEach(k=>delete l[k]);Object.assign(l,c)}else state.servicios.push(c);synced[r.id]=firma(c);pend.delete(r.id);return true}return false}
function aplicarCfg(r){if(!r)return false;
 if(pend.has('__cfg')&&(state.cfgAt||0)>=(r.updatedAt||0))return false;
 if((r.updatedAt||0)>(state.cfgAt||0)){state.users=r.users;state.negocio=r.negocio;state.cfgAt=r.updatedAt;synced.__cfg=JSON.stringify(cfgDe());pend.delete('__cfg');return true}return false}
let pulling=false;
async function pull(){if(!api||!codigo||pulling||!navigator.onLine)return;pulling=true;
 try{let cambio=false;const r=await apiSheets('bajar',{desde:Math.max(0,lastPull-5000)});
  for(const c of r.config||[])if(aplicarCfg(c))cambio=true;
  for(const x of r.servicios||[])if(aplicarServicio(x))cambio=true;
  lastPull=Math.max(lastPull,Number(r.ahora)||0);try{localStorage.setItem('st_pull2',String(lastPull))}catch(e){}
  if(!pend.size){lastSync=Date.now()}dbState='ok';if(cambio){persist();repintar()}}
 catch(e){console.warn(e);dbState='error'}finally{pulling=false;estado()}}
function vincularUsuario(){}
async function sincronizar(){await flush();await pull();await flush()}
async function conectar(){
 if(!window.ACETEC_CONFIG||!String(ACETEC_CONFIG.SHEETS_URL||'').startsWith('https://')){dbState='local';estado();return}
 api=ACETEC_CONFIG.SHEETS_URL;
 if(!codigo)codigo={correo:'',clave:''};
 ocultarLogin();sincronizar();setInterval(()=>{if(document.visibilityState==='visible')sincronizar()},30000)}
function mostrarLogin(){document.getElementById('login').style.display='flex'}
function ocultarLogin(){document.getElementById('login').style.display='none'}
async function entrar(e){e.preventDefault();const m=document.getElementById('lg_msg');const v={correo:lg_email.value.trim().toLowerCase(),clave:lg_pass.value};
 if(!v.correo||!v.clave){m.textContent='Escribe el correo y la clave.';return}
 if(!navigator.onLine){m.textContent='Para entrar la primera vez necesitas señal.';return}
 m.textContent='Entrando…';codigo=v;
 try{await apiSheets('probar')}catch(err){codigo=null;m.textContent=err.codigo==='bloqueado'?'Demasiados intentos. Espera 10 minutos y vuelve a intentar.':err.codigo==='codigo'?'Correo o clave incorrectos.':'No se pudo conectar. Revisa la señal e intenta de nuevo.';return}
 try{localStorage.setItem('st_cred',JSON.stringify(v))}catch(_){}
 m.textContent='';ocultarLogin();lastPull=0;await sincronizar();render();
 if(!window.__sinc){window.__sinc=setInterval(()=>{if(document.visibilityState==='visible')sincronizar()},30000)}}
async function salir(){if(pend.size&&!confirmarSalida)return modal(`<h3>Tienes ${pend.size} cambio(s) sin subir</h3><p>Si sales ahora se pierden. Conéctate a internet primero.</p><div class="row"><button class="btn dg" onclick="confirmarSalida=true;salir()">Salir de todos modos</button><button class="btn" onclick="cerrarModal()">Cancelar</button></div>`);
 confirmarSalida=false;cerrarModal();try{localStorage.removeItem('st_app');localStorage.removeItem('st_sync');localStorage.removeItem('st_pull2');localStorage.removeItem('st_cred')}catch(e){}
 location.reload()}
let confirmarSalida=false;
async function cambiarClave(){const a=cc_actual.value,n=cc_nueva.value,c=cc_conf.value,m=document.getElementById('cc_msg');
 if(!navigator.onLine){m.textContent='Necesitas señal para cambiar la contraseña.';return}
 if(!codigo||a!==codigo.clave){m.textContent='La contraseña actual no es correcta.';return}
 if(n.length<6){m.textContent='La nueva contraseña debe tener mínimo 6 caracteres.';return}
 if(n!==c){m.textContent='Las dos contraseñas nuevas no coinciden.';return}
 m.textContent='Guardando…';
 try{await apiSheets('cambiarClave',{nueva:n});codigo={...codigo,clave:n};try{localStorage.setItem('st_cred',JSON.stringify(codigo))}catch(_){}
  cc_actual.value=cc_nueva.value=cc_conf.value='';m.textContent='';toast('Contraseña cambiada')}
 catch(e){m.textContent='No se pudo cambiar. Revisa la señal e intenta de nuevo.'}}
function crearUsuario(){const n=nu_nombre.value.trim();const m=document.getElementById('nu_msg');
 if(!n){m.textContent='Escribe el nombre.';return}
 state.users.push({id:uid(),nombre:n,rol:nu_rol.value});
 save();cerrarModal();toast('Usuario agregado');render()}
function formUsuario(){
 modal(`<h3 style="margin-top:0">Nuevo usuario</h3>
 <label>Nombre</label><input id="nu_nombre">
 <label>Rol</label><select id="nu_rol"><option>Técnico</option><option>Administración</option></select>

 <button class="btn wa" style="font-weight:700" onclick="guardarTel('${s.id}');compartirPDF('${s.id}')">⟪file⟫ Enviar PDF por WhatsApp</button>
 <button class="btn" onclick="verPDF('${s.id}')">⟪download⟫ Descargar PDF</button>
 <a class="btn" id="r_wa" target="_blank" rel="noopener" onclick="guardarTel('${s.id}')" href="https://wa.me/${waNum(s.tel)}?text=${encodeURIComponent(t)}">⟪chat⟫ Enviar como texto</a>
 <a class="btn wa" style="background:#128c7e;border-color:#128c7e" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">⟪users⟫ Elegir chat en WhatsApp</a>

function vRep(){const l=vivos().filter(s=>s.repuesto&&s.estado!=='hecho');
 const est=['por pedir','pedido','llegó'];
 return `<h2>Repuestos pendientes</h2>${l.length?l.map(s=>`<div class="card"><div class="row"><div class="grow"><b>${esc(s.repuesto)}</b><div class="muted">${esc(s.producto)} · ${esc(s.cliente)} · ${nombreDia(s.fecha)}</div></div>
 <select style="width:auto" onchange="(state.servicios.find(x=>x.id==='${s.id}').repEstado=this.value);save();render()">${est.map(e=>`<option ${e===s.repEstado?'selected':''}>${e}</option>`).join('')}</select></div></div>`).join(''):'<div class="card muted">No hay repuestos pendientes.</div>'}`}
let q='';
function vHist(){const l=vivos().filter(s=>s.estado==='hecho'&&(s.cliente+s.tel+s.producto).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.cerradoEn.localeCompare(a.cerradoEn));
 const tot=l.reduce((a,s)=>a+s.mo+s.vr,0);
 return `<h2>Historial</h2><input placeholder="Buscar por cliente, teléfono o producto" value="${esc(q)}" oninput="q=this.value;const p=this.selectionStart;render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(p,p)">
 <p class="muted">${l.length} servicios terminados · Total ${$(tot)}</p>
 ${l.map(s=>`<div class="card"><div class="row"><div class="grow"><b>${esc(s.cliente)}</b> · ${esc(s.producto)}<div class="muted">${new Date(s.cerradoEn).toLocaleDateString('es-CO')} · ⟪user⟫ ${esc(U(s.tecnico).nombre)} · ${esc(s.trabajo)}</div></div><b>${$(s.mo+s.vr)}</b> <button class="btn sm" onclick="verRecibo('${s.id}')">⟪receipt⟫</button></div></div>`).join('')}`}
function vAjustes(){const N=state.negocio;
 return `${api&&codigo&&codigo.clave?`<h2>Ajustes</h2><div class="card"><div class="seccion" style="margin-top:0">⟪key⟫ Cambiar contraseña</div>
 <div class="muted">Correo para entrar: <b>${esc(codigo.correo)}</b></div>
 <label>Contraseña actual</label><input id="cc_actual" type="password" autocomplete="current-password">
 <label>Nueva contraseña (mínimo 6)</label><input id="cc_nueva" type="password" autocomplete="new-password">
 <label>Repite la nueva contraseña</label><input id="cc_conf" type="password" autocomplete="new-password">
 <div id="cc_msg" class="muted" style="margin-top:8px"></div>
 <div class="row" style="margin-top:12px"><button class="btn pr" onclick="cambiarClave()">⟪save⟫ Guardar contraseña</button></div>
 <div class="muted" style="margin-top:10px;font-size:13px">Al cambiarla, los demás celulares y computadores la pedirán de nuevo.</div></div>`:''}<h2>Usuarios</h2>${state.users.map(u=>`<div class="card"><div class="row"><div class="grow"><label>Nombre</label><input value="${esc(u.nombre)}" onchange="state.users.find(x=>x.id==='${u.id}').nombre=this.value;save();render()"></div>
 <div class="grow"><label>Rol</label><input value="${esc(u.rol)}" onchange="state.users.find(x=>x.id==='${u.id}').rol=this.value;save()"></div>
 
 ${state.users.length>1&&u.id!==state.cur?`<button class="btn sm dg" style="margin-top:22px" onclick="state.users=state.users.filter(x=>x.id!=='${u.id}');if(state.cur==='${u.id}')state.cur=state.users[0].id;save();render()">Quitar</button>`:''}</div></div>`).join('')}
 <button class="btn pr" onclick="formUsuario()">⟪plus⟫ Agregar usuario</button>
 ${'Notification' in window&&Notification.permission!=='granted'?`<div class="card row" style="margin-top:16px"><div class="grow"><b>Avisos en el celular</b><div class="muted">Te avisa al abrir la app qué servicio lleva más tiempo esperando.</div></div><button class="btn pr" onclick="activarAvisos()">⟪bell⟫ Activar avisos</button></div>`:''}
 <div class="card" style="margin-top:16px"><label style="margin-top:0">⟪user⟫ Usuario principal (recibe el aviso cuando otro termina un servicio)</label>
 <select onchange="state.negocio.principal=this.value;save();render()">${state.users.map(u=>`<option value="${u.id}" ${u.id===principalId()?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></div>
 <h2 style="margin-top:24px">Datos del negocio (para el recibo)</h2><div class="card">
 <label>Nombre del negocio</label><input value="${esc(N.nombre)}" onchange="state.negocio.nombre=this.value;save()"><label>Lema</label><input value="${esc(N.lema)}" onchange="state.negocio.lema=this.value;save()">
 <label>Teléfono</label><input value="${esc(N.tel)}" onchange="state.negocio.tel=this.value;save()">
 <label>Dirección</label><input value="${esc(N.dir)}" onchange="state.negocio.dir=this.value;save()">
 <p class="muted">Sin NIT por ahora; se puede agregar después.</p></div>
 <button class="btn dg" style="display:none" onclick="modal('<h3>¿Borrar todos los datos de prueba?</h3><div class=row><button class=\\'btn dg\\' onclick=\\'localStorage.removeItem(&quot;st_app&quot;);localStorage.removeItem(&quot;st_sync&quot;);synced={};pend=new Set();load();cerrarModal();render()\\'>Sí, reiniciar</button> <button class=btn onclick=cerrarModal()>Cancelar</button></div>')">Reiniciar datos de prueba</button>`}
function modal(h){modalBody.innerHTML=icz(h);const m=document.getElementById('modal');m.classList.add('on');m.style.minHeight=Math.max(document.documentElement.scrollHeight,innerHeight)+'px';scrollTo(0,0)}
function cerrarModal(){const on=document.getElementById('modal').classList.contains('on');document.getElementById('modal').classList.remove('on');if(on&&view!=='nuevo')soltarMios()}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')cerrarModal()};
function toast(m){const d=document.createElement('div');d.className='toast';d.innerHTML=icz(esc(m));document.body.appendChild(d);setTimeout(()=>d.classList.add('out'),2300);setTimeout(()=>d.remove(),2700)}
load();render();estado();conectar();avisoDiario();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
